<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1022">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vättigt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One full-screen game: control panels left and right of the scene, screens on top. Single dark theme. */
  color-scheme: dark;
  --ground:#0c1022; --panel:#151b36; --line:#313b6b; --ink:#ebe6d8; --dim:#aab1cb; --sun:#ffd27a; --team:#e5533d;
  --display:"Pixelify Sans","Courier New",monospace; --body:"Albert Sans","Segoe UI",system-ui,sans-serif;
  --side:110px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);font-weight:500;color:var(--ink);background:var(--panel);border:2px solid var(--line);
  min-height:44px;padding:6px 10px;font-size:17px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#1b1a14}

#game{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) auto var(--side);justify-content:center;align-items:stretch;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pad{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:8px;border-color:var(--team);min-width:0}
.pad .top,.pad .bottom{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.row > button{flex:1}
.big{min-height:64px;font-size:28px}
#jump{min-height:56px}
.weapon{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:13px;line-height:1.1;padding:5px 4px;overflow-wrap:anywhere;hyphens:auto}
.weapon canvas{width:30px;height:27px;image-rendering:pixelated;flex:none}
.weapon small{display:block;font-family:var(--body);font-size:11px;opacity:.85}
#drop{background:var(--team);border-color:var(--team);color:#fff;font-size:14px;overflow-wrap:anywhere}
.stagewrap{display:flex;align-items:center;justify-content:center;min-width:0}
#stage{position:relative;touch-action:none;border-left:3px solid var(--team);border-right:3px solid var(--team)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#scene{image-rendering:pixelated;image-rendering:crisp-edges}
#glow{mix-blend-mode:screen;pointer-events:none}
#hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(12,16,34,.82);border:2px solid var(--line);
  padding:6px 12px;font-size:14px;color:var(--ink);pointer-events:none;white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis}
#hint[hidden]{display:none}

.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,10,24,.86);z-index:5;overflow:auto}
.screen[hidden]{display:none}
.card{background:var(--panel);border:2px solid var(--line);padding:20px 24px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%}
.card h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,9vh,64px);line-height:1;margin:0;color:var(--sun)}
.card h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--dim);line-height:1.45;max-width:60ch}
.card .label{font-family:var(--display);color:var(--dim);font-size:16px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.primary{background:var(--sun);border-color:var(--sun);color:#1b1a14;font-size:24px;min-height:56px}
@media (max-height:440px){.card{padding:14px 18px;gap:10px}.card h1{font-size:40px}.card p{font-size:15px}.primary{min-height:48px;font-size:22px}}
#title{background:radial-gradient(ellipse at 70% 120%,rgba(255,194,122,.25),transparent 60%),rgba(8,10,24,.9)}
</style>
</head>
<body>

<div id="game" aria-label="Vättigt">
  <div class="pad" id="left">
    <div class="top">
      <button type="button" id="menu">Meny</button>
      <button type="button" id="mute" aria-pressed="false">Ljud av</button>
    </div>
    <div class="bottom">
      <div class="row">
        <button type="button" class="big" id="walkL" aria-label="Gå vänster">◀</button>
        <button type="button" class="big" id="walkR" aria-label="Gå höger">▶</button>
      </div>
      <button type="button" id="jump">Hoppa</button>
    </div>
  </div>

  <div class="stagewrap">
    <div id="stage">
      <canvas id="scene" width="480" height="270" role="img" aria-label="Spelplanen: Midsommarängen med två lag vättar"></canvas>
      <canvas id="glow" aria-hidden="true"></canvas>
      <div id="hint" hidden>Dra i bilden för att sikta. Släpp för att skjuta.</div>
    </div>
  </div>

  <div class="pad" id="right">
    <div class="top" role="group" aria-label="Vapen" id="weapons"></div>
    <div class="bottom">
      <button type="button" id="drop" hidden>Lägg dynamiten</button>
    </div>
  </div>
</div>

<div class="screen" id="title">
  <div class="card">
    <h1>Vättigt</h1>
    <p>Två lag vättar slåss om midsommarängen. Turas om på samma telefon: gå, hoppa, sikta och skjut. Laget som har vättar kvar sist vinner.</p>
    <span class="label" id="l-mood">Stämning</span>
    <div class="choices" role="group" aria-labelledby="l-mood" id="moods"></div>
    <button type="button" class="primary" id="play">Spela</button>
  </div>
</div>

<div class="screen" id="pause" hidden>
  <div class="card">
    <h2>Paus</h2>
    <div class="choices">
      <button type="button" class="primary" id="resume">Fortsätt</button>
      <button type="button" id="restart">Ny match</button>
      <button type="button" id="toTitle">Till start</button>
    </div>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <h2 id="overText">Vettvillingarna vinner!</h2>
    <p id="overSub"></p>
    <div class="choices">
      <button type="button" class="primary" id="again">Spela igen</button>
      <button type="button" id="overTitle">Till start</button>
    </div>
  </div>
</div>

<div class="screen" id="rotate" hidden>
  <div class="card">
    <h2>Vänd telefonen</h2>
    <p>Vättigt spelas med telefonen liggande.</p>
    <button type="button" id="anyway">Spela ändå</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
